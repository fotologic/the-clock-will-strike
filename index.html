<template id="t-info">
  <h2>The Clock Will Strike</h2>
  <p>In Karl Ove Knausgaard’s ‘The School of Night’, Kristian Hadeland, a Norwegian photography student in London in 1985, is asked to photograph the places connected with Christopher Marlowe for the poster of a fringe performance of ‘Doctor Faustus’. He makes the pictures but too late for the poster.</p>
  <p>These photographs retrace his imagined route through Deptford, Shoreditch, Newgate, Southwark and Scadbury. The title comes from Faustus’s last speech, as his final hour runs out.</p>
  <p>This investigation began with the notion of the Terrain Vague, borrowed from <a href="https://ianwalkerphoto.com/surrealism/in-paris/man-ray/terrain-vague/">Man Ray’s photograph</a> and from the architect Ignasi de Solà-Morales, whose 1995 essay of that title used the French phrase for the city’s leftover ground: empty lots, margins and places that have fallen out of use. He began from the photographers who had found these places before the architects did, and he dwelt on the word itself. Vague carries the sense of vacant (free and available) and also the sense of uncertain and unbounded. The wall is meant to be that kind of ground, mostly empty, with no edges marked and nothing telling you where to go.</p>
  <p>The way you cross it comes from the dérive, the drift Guy Debord described in 1956: a walk in which you drop your usual reasons for going anywhere and let the terrain, and whatever you meet there, draw you on. A year later Debord and Asger Jorn cut up a map of Paris and reassembled the pieces, joined by curving arrows, as The Naked City, a map made from how the city felt to walk through, with the distances left out. The lines that form here belong to that kind of map.</p>
  <p>Move slowly. A picture comes into focus only when you stand still in front of it, and fades if you leave it for long. Pictures from the same place are joined as you find them, in the order you find them, so no two visits make the same map. Once a few connections have formed, you can step back and see the whole wall.</p>

  <blockquote>The Old Bailey, Shoreditch, Southwark, Chislehurst, Deptford. These were Marlowe’s London places. I could cover them all in a week.<br><span class="ph-note">Kristian, p. 203</span></blockquote>
  <blockquote>… the connection between Marlowe and his London localities was by the nature of things not visually apparent …<br><span class="ph-note">Kristian, p. 301</span></blockquote>
  <blockquote>Hell hath no limits, nor is circumscribed<br>In one self place, for where we are is hell,<br>And where hell is, must we ever be.<br><span class="ph-note">Mephistopheles</span></blockquote>
  <blockquote>Only time separated us. Only time? Surely there was no greater divide! Even a minute was an abyss.<br><span class="ph-note">Kristian, p. 303</span></blockquote>
  <blockquote>O lente, lente currite noctis equi!<br><span class="ph-note">Faustus in his last hour, borrowing from Ovid: run slowly, slowly, horses of the night</span></blockquote>
  <blockquote>‘I’m afraid you’re too late.’<br><span class="ph-note">Kristian, p. 306</span></blockquote>
  <blockquote>The stars move still, time runs, the clock will strike,<br>The devil will come, and Faustus must be damned.<br><span class="ph-note">Faustus</span></blockquote>
  <blockquote>He must have walked these streets, Marlowe.<br><span class="ph-note">Kristian, p. 330</span></blockquote>
  <blockquote>Cut is the branch that might have grown full straight,<br>And burnèd is Apollo’s laurel bough.<br><span class="ph-note">The Chorus, at the end of the play</span></blockquote>
  <p class="ph-note">Karl Ove Knausgaard, <i>The School of Night</i>, translated by Martin Aitken. Christopher Marlowe, <i>Doctor Faustus</i>, spelling modernised.</p>

  // the line stops where it leaves one picture and meets the other
  let i0=0;while(i0<pts.length-1&&inside(a,...pts[i0]))i0++;
  let i1=pts.length-1;while(i1>i0&&inside(b,...pts[i1]))i1--;
  const S=pts.slice(i0,i1+1);
  const l=document.createElementNS(NS,'path');
  l.setAttribute('d','M'+S.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L'));
  for(const[k,v]of Object.entries({fill:'none',stroke:'#1d1d1b','stroke-width':1.2,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'}))l.setAttribute(k,v);
  l.dataset.locs=locs.join(' ');
  lines.appendChild(l);
  if(dash)l.setAttribute('stroke-dasharray',dash);
  else if(!reduce){const L=l.getTotalLength();
    l.setAttribute('stroke-dasharray',L);l.setAttribute('stroke-dashoffset',L);
    requestAnimationFrame(()=>requestAnimationFrame(()=>l.setAttribute('stroke-dashoffset',0)));}
  for(const[x,y]of[S[0],S[S.length-1]]){
    const d=document.createElementNS(NS,'circle');
    d.setAttribute('cx',x);d.setAttribute('cy',y);d.setAttribute('r',4);d.setAttribute('fill','#1d1d1b');
    d.dataset.locs=locs.join(' ');labels.appendChild(d);
  }
  if(++links>=3)document.body.classList.add('mapped');
  setActive(locs[locs.length-1]);
}
function setActive(loc){
  active=loc;
  for(const l of world.querySelectorAll('[data-locs]'))l.classList.toggle('act',l.dataset.locs.split(' ').includes(loc));
  for(const t of labels.querySelectorAll('text'))t.classList.toggle('act',t.dataset.loc===loc);
}
// names: placed in the nearest clear ground to the group's centre, above the pictures
// a place's name appears beside the picture that completed it, where the viewer was standing
function name(loc,at){
  const cx=at.cx,cy=at.cy;
  const tw=loc.length*18+24,th=32;
  let px=cx,py=at.y+at.h+40;
  const order=[4,3,5,12,11,13,0,8,2,6,10,14,1,7,9,15];
  search:for(let r=Math.min(at.w,at.h)/2;r<2400;r+=40)for(const a of order){
    const x=cx+r*Math.cos(a*Math.PI/8),y=cy+r*Math.sin(a*Math.PI/8);
    if(x-tw/2<20||x+tw/2>W-20||y-th<20||y>H-20)continue;
    if(!items.some(o=>x+tw/2>o.x-16&&x-tw/2<o.x+o.w+16&&y>o.y-16&&y-th<o.y+o.h+16)){px=x;py=y;break search}
  }
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',px);t.setAttribute('y',py);t.setAttribute('text-anchor','middle');
  t.setAttribute('class','loc');t.dataset.loc=loc;t.textContent=loc;labels.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{t.classList.add('on');t.classList.toggle('act',active===loc)}));
}
const lastBy={};let hingeDone=false,dimT;
function pulse(a,b){
  if(reduce)return;
  a.el.classList.add('pulse');b.el.classList.add('pulse');world.classList.add('dim');
  clearTimeout(dimT);
  dimT=setTimeout(()=>{world.classList.remove('dim');for(const i of items)i.el.classList.remove('pulse')},1700);
}
function find(it){
  it.found=true;it.el.classList.add('found');it.el.style.removeProperty('--p');
  const prev=lastBy[it.loc];lastBy[it.loc]=it;
  if(prev){line(prev,it,[it.loc]);pulse(prev,it)}else setActive(it.loc);
  // one dashed line, from whichever Worship Street picture lies nearest a Newgate picture
  const ng=groups.Newgate,ws=items.filter(i=>HINGE.has(i.f)&&i.found);
  if(!hingeDone&&ws.length&&ng.every(i=>i.found)){
    hingeDone=true;
    let best=null;
    for(const w of ws)for(const n of ng){const d=Math.hypot(w.cx-n.cx,w.cy-n.cy);if(!best||d<best.d)best={w,n,d}}
    line(best.w,best.n,['Shoreditch','Newgate'],'5 6');
  }
  if(groups[it.loc].every(i=>i.found))name(it.loc,it);
}

// walking: stillness brings pictures into focus; pictures you leave behind slowly fade
let px=0,py=0,pt=0,speed=0,overview=false,live=false;
function tick(now){
  const dt=Math.min(now-pt,100);pt=now;
  const x=sc.scrollLeft,y=sc.scrollTop,vw=sc.clientWidth,vh=sc.clientHeight;
  const v=Math.hypot(x-px,y-py)/Math.max(dt,1);px=x;py=y;speed=speed*.8+v*.2;
  const still=speed<SLOW&&!dragging;
  if(live&&!overview){
    // only the picture at the centre of the view can come into focus
    // (the nearest of the pictures mostly in view, so pictures at the wall's edges can be reached too)
    const mx=x+vw/2,my=y+vh/2;let central=null,cd=1e9;
    for(const it of items){
      const ix=Math.max(0,Math.min(it.x+it.w,x+vw)-Math.max(it.x,x)),iy=Math.max(0,Math.min(it.y+it.h,y+vh)-Math.max(it.y,y));
      it.frac=ix*iy/Math.min(it.w*it.h,vw*vh*.9);
      if(it.frac>.5){const d=Math.hypot(it.cx-mx,it.cy-my);if(d<cd){cd=d;central=it}}
    }
    for(const it of items){
    const frac=it.frac;
    const isC=it===central;
    if(!it.found){
      if(isC&&frac>.5&&still)it.dwell+=dt;else it.dwell=Math.max(0,it.dwell-dt*2);
      it.el.style.setProperty('--p',(isC?Math.min(1,it.dwell/DWELL):0).toFixed(3));
      if(it.dwell>=DWELL)find(it);
    }else{
      it.el.classList.toggle('side',!isC);
      if(frac<.05){it.away+=dt;it.seen=0;if(it.away>FORGET)it.el.classList.add('mem')}
      else{it.away=0;
        if(isC&&still){it.seen+=dt;
          if(it.seen>REDWELL){it.el.classList.remove('mem');if(active!==it.loc)setActive(it.loc)}}
        else it.seen=0;}
    }
    }
  }

  if(now-chromeT>160){chromeT=now;chrome();placeSound()}
  requestAnimationFrame(tick);
}
// title and links turn pale where a dark part of a picture lies beneath them
let chromeT=0,scale=1;
const chromeEls=[$('title'),...document.querySelectorAll('#menu button'),$('ov')];
function chrome(){
  const ox=sc.scrollLeft,oy=sc.scrollTop;
  for(const el of chromeEls){
    const r=el.getBoundingClientRect();
    if(!r.width){el.classList.remove('pale');continue}
    const x0=(ox+r.left)/scale,y0=(oy+r.top)/scale,x1=(ox+r.right)/scale,y1=(oy+r.bottom)/scale;
    let best=0,lum=1;
    for(const it of items){
      if(!it.found||!it.lum)continue;
      const ix=Math.min(x1,it.x+it.w)-Math.max(x0,it.x),iy=Math.min(y1,it.y+it.h)-Math.max(y0,it.y);
      if(ix<=0||iy<=0)continue;
      const cover=ix*iy/((x1-x0)*(y1-y0));if(cover<=best)continue;
      const{gw,gh,L}=it.lum;
      const cx0=Math.max(0,Math.floor((Math.max(x0,it.x)-it.x)/it.w*gw)),cx1=Math.min(gw-1,Math.floor((Math.min(x1,it.x+it.w)-it.x)/it.w*gw));
      const cy0=Math.max(0,Math.floor((Math.max(y0,it.y)-it.y)/it.h*gh)),cy1=Math.min(gh-1,Math.floor((Math.min(y1,it.y+it.h)-it.y)/it.h*gh));
      let sum=0,n=0;for(let y=cy0;y<=cy1;y++)for(let x=cx0;x<=cx1;x++){sum+=L[y*gw+x];n++}
      let v=n?sum/n:1;
      if(it.el.classList.contains('mem'))v=1-.18*(1-v);else if(it.el.classList.contains('side'))v=1-.3*(1-v);
      v=v*cover+1*(1-cover);   // the uncovered part of the text sits on white
      best=cover;lum=v;
    }
    el.classList.toggle('pale',lum<.5);
  }
}

// drag to pan; capture only once the pointer has really moved, so clicks still reach pictures
let dragging=false,moved=false,down=false,sx,sy,sl,st;
sc.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'||e.button!==0)return;
  down=true;moved=false;sx=e.clientX;sy=e.clientY;sl=sc.scrollLeft;st=sc.scrollTop;
});
sc.addEventListener('pointermove',e=>{
  if(!down)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(!moved&&Math.abs(dx)+Math.abs(dy)>5){moved=true;dragging=true;sc.classList.add('dragging');sc.setPointerCapture(e.pointerId)}
  if(moved){sc.scrollLeft=sl-dx;sc.scrollTop=st-dy}
});
const end=()=>{down=false;dragging=false;sc.classList.remove('dragging');setTimeout(()=>moved=false,0)};
sc.addEventListener('pointerup',end);sc.addEventListener('pointercancel',end);

// looking closely
function openBox(it){
  box.querySelector('img').src=it.el.src;
  box.querySelector('span').textContent=groups[it.loc].every(i=>i.found)?it.loc:'';
  box.classList.add('on');
}
box.addEventListener('click',()=>box.classList.remove('on'));

// panels and sound
const panel=$('panel'),art=panel.querySelector('article');
for(const b of document.querySelectorAll('#menu [data-p]'))b.addEventListener('click',()=>{
  art.innerHTML=$('t-'+b.dataset.p).innerHTML;panel.classList.add('on');
});
$('close').addEventListener('click',()=>panel.classList.remove('on'));
addEventListener('keydown',e=>{if(e.key==='Escape'){box.classList.remove('on');panel.classList.remove('on')}});
// sound: each recording belongs to a place and sits among that place's pictures,
// found or not, so you can walk towards a sound before you can see where it comes from
const SOUNDS=[{loc:'Deptford',file:'snd/deptford.mp3'},{loc:'Shoreditch',file:'snd/shoreditch.mp3'},{loc:'Southwark',file:'snd/southwark.mp3'},{loc:'Scadbury',file:'snd/scadbury.mp3'}];
// Newgate has no sound of its own: the prison is the one silent place
const snd=$('snd');let ac=null,soundOn=false;
async function startSound(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
  for(const so of SOUNDS){
    try{
      const buf=await ac.decodeAudioData(await (await fetch(so.file)).arrayBuffer());
      const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
      src.loopStart=.06;src.loopEnd=buf.duration-.06;   // step over encoder padding at either end
      const g=ac.createGain();g.gain.value=0;
      const pan=ac.createStereoPanner?ac.createStereoPanner():null;
      src.connect(g);if(pan){g.connect(pan);pan.connect(master)}else g.connect(master);
      src.start(0,Math.random()*(buf.duration-1));        // a different moment on every visit
      Object.assign(so,{g,pan,pics:groups[so.loc]});
    }catch(e){}
  }
}
function placeSound(){
  if(!ac||!soundOn)return;
  const vw=sc.clientWidth,vh=sc.clientHeight,cx=(sc.scrollLeft+vw/2)/scale,cy=(sc.scrollTop+vh/2)/scale;
  const R=Math.max(900,Math.min(vw,vh)*1.2)/scale,t=ac.currentTime;   // each place is heard only near its own pictures
  for(const so of SOUNDS){
    if(!so.g)continue;
    let near=null,dmin=1e9;
    for(const it of so.pics){
      const dx=Math.max(it.x-cx,0,cx-(it.x+it.w)),dy=Math.max(it.y-cy,0,cy-(it.y+it.h)),d=Math.hypot(dx,dy);
      if(d<dmin){dmin=d;near=it}
    }
    // from above the wall every place is equally near: The Naked City leaves the distances out
    const v=overview?.12:Math.max(0,1-dmin/R)**2;
    so.g.gain.setTargetAtTime(v,t,.5);
    if(so.pan&&near)so.pan.pan.setTargetAtTime(overview?0:Math.max(-.85,Math.min(.85,(near.cx-cx)/(vw*1.3/scale))),t,.5);
  }
}
snd.addEventListener('click',async()=>{
  if(!ac){snd.textContent='sound: loading';await startSound()}
  soundOn=!soundOn;
  if(soundOn){await ac.resume();placeSound()}else await ac.suspend();
  snd.textContent=soundOn?'sound: on':'sound: off';
});

// the whole wall (a testing aid)
let back={x:0,y:0};
$('ov').addEventListener('click',e=>{
  overview=!overview;world.classList.toggle('ov',overview);
  if(overview){
    back={x:sc.scrollLeft,y:sc.scrollTop};
    const s=Math.min(sc.clientWidth/W,sc.clientHeight/H)*.96;
    world.style.transform=`scale(${s})`;scale=s;world.style.setProperty('--s',(s*2.4).toFixed(4));
    sizer.style.width=W*s+'px';sizer.style.height=H*s+'px';e.target.textContent='walk';
  }else{
    world.style.transform='';scale=1;world.style.removeProperty('--s');
    sizer.style.width=W+'px';sizer.style.height=H+'px';
    sc.scrollLeft=back.x;sc.scrollTop=back.y;e.target.textContent='whole wall';
  }
});

// threshold
sc.scrollLeft=start.cx-sc.clientWidth/2;sc.scrollTop=start.cy-sc.clientHeight/2;
px=sc.scrollLeft;py=sc.scrollTop;
$('enter').addEventListener('click',()=>{
  document.body.classList.add('in');
  setTimeout(()=>{find(start);live=true},900);
});
requestAnimationFrame(t=>{pt=t;tick(t)});
}
</script>
</body>
